[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S", "FURB"]
# Long Telegram copy is deliberately kept as readable message text; assertions are expected in tests.
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# Kurigram's decorators and update models are dynamic: a private-message filter guarantees
# from_user/message at runtime, but the published stubs conservatively mark them optional.
disable_error_code = ["misc", "union-attr"]

[tool.pytest.ini_options]
# Kurigram 2.2 emits this Python 3.13-only import-time warning internally; bot code does not call the deprecated API.
filterwarnings = ["ignore:There is no current event loop:DeprecationWarning:pyrogram\\.utils"]
